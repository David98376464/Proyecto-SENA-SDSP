<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGSP | Inicio de sesión</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/responsive.css">


</head>

<body>

    <main class="login-container">

        <section class="login-left">

            <div class="logo">

                <img src="assets/img/logo.pnj.jpeg" alt="Logo SGSP">

            </div>

            <div class="login-header">

                <h1>Bienvenido a SGSP</h1>

                <p>
                    Sistema de Gestión y Seguimiento de Proyectos
                </p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label>Tipo de usuario</label>

                    <div class="roles">

                        <button type="button" class="role-btn">
                         Administrador
                        </button>

                        <button type="button" class="role-btn">
                        Supervisor
                        </button>

                        <button type="button" class="role-btn">
                        Empleado
                        </button>

                    </div>

                <span id="roleError" class="error-message"></span>

                </div>

                
                <div class="input-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="correo@empresa.com">

                    <span id="correoError" class="error-message"></span>

                </div>



                <div class="input-group">

                    <label for="password">

                        Contraseña

                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="********">

                        <button
                            type="button"
                            class="show-password">

                            👁

                        </button>

                    </div>
                    
                    <span id="passwordError" class="error-message"></span>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Recordarme

                    </label>

                    <a href="#">

                        ¿Olvidaste tu contraseña?

                    </a>

                </div>

                <button
                    type="submit"
                    class="login-btn">

                    Iniciar sesión

                </button>

            </form>

        </section>

        

        <section class="login-right">

            <div class="overlay">

                <div class="hero-content">

                    <span class="badge">

                        SGSP

                    </span>

                    <h2>

                        Sistema de Gestión y Seguimiento de Proyectos

                    </h2>

                    <p>

                        Gestiona proyectos, empleados, materiales y tareas
                        desde un único lugar.

                    </p>

                    <div class="slider-dots">

                        <span></span>
                        <span class="active"></span>
                        <span></span>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="assets/js/login.js"></script>

</body>

</html>
